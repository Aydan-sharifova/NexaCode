name: coding-platform

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_HTTP_PORTS: "8080"
  ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD},abortConnect=false
  Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER}
  Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
  Jwt__Key: ${JWT_KEY:?Set JWT_KEY}
  Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
  AllowedHosts: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
  Database__ApplyMigrations: "false"
  Database__SeedDevelopmentData: "false"
  Smtp__Enabled: ${SMTP_ENABLED:-false}
  Smtp__Host: ${SMTP_HOST:-}
  Smtp__Port: ${SMTP_PORT:-587}
  Smtp__UseSsl: ${SMTP_USE_SSL:-false}
  Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-true}
  Smtp__CheckCertificateRevocation: ${SMTP_CHECK_CERTIFICATE_REVOCATION:-true}
  Smtp__Username: ${SMTP_USERNAME:-}
  Smtp__Password: ${SMTP_PASSWORD:-}
  Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
  Smtp__FromName: ${SMTP_FROM_NAME:-Coding}
  Smtp__ClientBaseUrl: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
  AI__Provider: ${AI_PROVIDER:-Ollama}
  OpenAICompatible__BaseUrl: ${OPENAI_COMPATIBLE_BASE_URL:-http://host.docker.internal:11434/v1/}
  OpenAICompatible__Model: ${OPENAI_COMPATIBLE_MODEL:-qwen2.5-coder:1.5b}
  OpenAICompatible__VisionModel: ${OPENAI_COMPATIBLE_VISION_MODEL:-aydan-vision}
  OpenAICompatible__ApiKey: ${OPENAI_COMPATIBLE_API_KEY:-ollama}
  OpenAICompatible__MaxOutputTokens: ${OPENAI_COMPATIBLE_MAX_OUTPUT_TOKENS:-2048}
  OpenAICompatible__Temperature: ${OPENAI_COMPATIBLE_TEMPERATURE:-0.1}
  Execution__Enabled: ${EXECUTION_ENABLED:-false}
  Execution__DotNetImage: ${EXECUTION_DOTNET_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0}

services:
  frontend:
    image: ${FRONTEND_IMAGE:-coding-frontend:1.0.0}
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped
    networks: [frontend, backend]

  api:
    image: ${API_IMAGE:-coding-api:1.0.0}
    build:
      context: .
      dockerfile: src/Coding.Api/Dockerfile
    environment: *api-environment
    ports:
      - "${API_PORT:-5192}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - avatar-data:/app/wwwroot/uploads/avatars
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [backend]

  migrate:
    image: ${API_IMAGE:-coding-api:1.0.0}
    build:
      context: .
      dockerfile: src/Coding.Api/Dockerfile
    command: ["--migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["operations"]
    networks: [backend]

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    expose: ["6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks: [backend]

volumes:
  postgres-data:
  redis-data:
  avatar-data:

networks:
  frontend:
  backend:
